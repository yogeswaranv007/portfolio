<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Contact Message</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .header { background-color: #f4f4f4; padding: 10px 20px; border-radius: 8px 8px 0 0; border-bottom: 2px solid #007bff; }
        .content { padding: 20px 0; }
        .label { font-weight: bold; color: #555; }
        .message-box { background-color: #f9f9f9; border-left: 4px solid #007bff; padding: 15px; margin-top: 15px; white-space: pre-wrap; }
        .footer { font-size: 12px; color: #777; margin-top: 20px; text-align: center; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="margin: 0; color: #333;">New Portfolio Contact</h2>
        </div>
        <div class="content">
            <p><span class="label">Name:</span> <span th:text="${name}"></span></p>
            <p><span class="label">Email:</span> <a th:href="'mailto:' + ${email}" th:text="${email}"></a></p>
            <p><span class="label">Subject:</span> <span th:text="${subject}"></span></p>
            <p><span class="label">Time:</span> <span th:text="${#dates.format(timestamp, 'dd MMM yyyy HH:mm z')}"></span></p>
            
            <p class="label" style="margin-bottom: 5px;">Message:</p>
            <div class="message-box" th:text="${messageContent}"></div>
        </div>
        <div class="footer">
            <p>This is an automated message from your Portfolio Contact System.</p>
        </div>
    </div>
</body>
</html>
