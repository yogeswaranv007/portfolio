# Local PostgreSQL Database for Development
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Settings (Local Dev Fallback Only - Never use in production)
app.jwt.secret=${JWT_SECRET:local_dev_only_jwt_secret_minimum_64_characters_long_for_hs512_development_only}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Frontend CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
