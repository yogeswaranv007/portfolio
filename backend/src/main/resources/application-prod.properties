# Neon PostgreSQL Database for Production (Using Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Settings
app.jwt.secret=${JWT_SECRET:8f2f84090b4d45548682057d62055627eb18d6a8f152d5b62b19280d908d0c2e36466f27b9c922a6bbec4b4c7317e08929e71e9a3b6f001f3724c08479e390c5}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Frontend CORS
app.cors.allowed-origins=${FRONTEND_URL}
